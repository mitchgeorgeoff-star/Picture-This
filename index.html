<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Picture This!</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- This page uses a single story layout with a large hero image and a clear title block. -->
  <header class="hero">
    <div class="title-block">
      <h1>Picture This!</h1>
      <h2>My Really Cool Blog Post</h2>
    </div>

    <!-- The photo should stay wide and cinematic to match the mockup, using the landscape set across the page. -->
    <picture class="image-frame">
      <source
        srcset="images/landscape-320.jpg 320w, images/landscape-480.jpg 480w, images/landscape-640.jpg 640w, images/landscape-720.jpg 720w, images/landscape-960.jpg 960w, images/landscape-1440.jpg 1440w, images/landscape-1920.jpg 1920w, images/landscape-2160.jpg 2160w, images/landscape-2880.jpg 2880w"
        sizes="(max-width: 959px) 90vw, 90vw"
      >
      <img src="images/landscape-960.jpg" alt="A gallery space with a striking display of framed art and lighting.">
    </picture>
  </header>

  <div class="lower-panel" aria-hidden="true"></div>
</body>


</html>

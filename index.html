<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Picture This!</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- This page uses a single story layout with a large hero image and a clear title block. -->
  <header class="hero">
    <div class="title-block">
      <h1>Picture This!</h1>
    </div>

    <!-- The picture element lets the browser swap between landscape and square image sets depending on viewport width. -->
    <picture class="image-frame">
      <source
        media="(max-width: 959px)"
        srcset="images/landscape-320.jpg 320w, images/landscape-480.jpg 480w, images/landscape-640.jpg 640w, images/landscape-720.jpg 720w, images/landscape-960.jpg 960w, images/landscape-1440.jpg 1440w, images/landscape-1920.jpg 1920w, images/landscape-2160.jpg 2160w, images/landscape-2880.jpg 2880w"
        sizes="(max-width: 959px) 80vw, 960px"
      >
      <source
        media="(min-width: 960px)"
        srcset="images/square-480.jpg 480w, images/square-640.jpg 640w, images/square-800.jpg 800w, images/square-960.jpg 960w, images/square-1280.jpg 1280w, images/square-1600.jpg 1600w, images/square-1920.jpg 1920w, images/square-2400.jpg 2400w"
        sizes="(min-width: 960px) 48vw, 960px"
      >
      <img src="images/square-960.jpg" alt="A gallery space with a striking display of framed art and lighting.">
    </picture>
  </header>
</body>


</html>
